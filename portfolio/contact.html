<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Arieff</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <aside class="sidebar">
        <div class="logo">Ayippooo.</div>
        <div class="hamburger">
            <span></span><span></span><span></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="academic.html">Academic</a></li>
            <li><a href="experience.html">Experience</a></li>
            <li><a href="work.html">Work</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </aside>

    <main class="content">
        <section class="page-section reveal">
            <div class="grid-2">
                <div>
                    <h1 class="page-title">Get in touch.</h1>
                    <p class="contact-desc">I am always open to discussing product design work or partnership opportunities.</p>
                    <div class="contact-info">
                        <h4>Email</h4>
                        <a href="mailto:hello@arieff.com">hello@arieff.com</a>
                        <h4>Phone</h4>
                        <p>+60 12 345 6789</p>
                    </div>
                </div>
                <div class="card form-card">
                    <form onsubmit="event.preventDefault(); alert('Message sent!');">
                        <div class="input-group">
                            <label>Name</label>
                            <input type="text" required>
                        </div>
                        <div class="input-group">
                            <label>Email</label>
                            <input type="email" required>
                        </div>
                        <div class="input-group">
                            <label>Message</label>
                            <textarea rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn-primary">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
